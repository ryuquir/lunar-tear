<text x="40.0" y="1269.0" font-size="19" fill="#1c2530" text-anchor="start" font-weight="normal">・任天堂の大型シェル（HVC-ExROM 系）用。左右の端は基準より 0.2 mm 内側の直線、切り欠きとスリットは角の丸みの分だけ 0.6 mm 広げてある。</text>
<text x="40.0" y="1301.0" font-size="19" fill="#1c2530" text-anchor="start" font-weight="normal">・シェルの実物では未確認（最初はモジュールを付ける前に、基板だけをシェルに入れて確かめる）。</text>
